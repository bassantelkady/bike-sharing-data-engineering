
services:
  pgdatabase:
    image: postgres:16
    container_name: bike-sharing-db
    environment:
      POSTGRES_USER: bike_user
      POSTGRES_PASSWORD: bike_password
      POSTGRES_DB: bike_sharing
    ports:
      - "5432:5432"
    volumes:
      - bike_sharing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike_user -d bike_sharing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bike_sharing_data:
